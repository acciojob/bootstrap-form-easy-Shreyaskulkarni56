<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
<div class="container mt-4 border p-3">

    <h2 class="text-center mb-5">Internship Form</h2>

    <form class="needs-validation" novalidate>

        <div class="row mb-3">

            <div class="col-md-4">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" id="first-name-input" required>
                <div class="invalid-feedback">
                    First name required!
                </div>
            </div>

            <div class="col-md-4">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last-name-input" required>
                <div class="invalid-feedback">
                    Last name required!
                </div>
            </div>

            <div class="col-md-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email-input"
                    placeholder="xyz@abc.com" required>
                <div class="invalid-feedback">
                    Email required!
                </div>
            </div>

        </div>

        <div class="row mb-3">

            <div class="col-md-6">
                <label class="form-label">College</label>
                <input type="text" class="form-control" id="college-input" required>
                <div class="invalid-feedback">
                    Please provide a valid college.
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label">Graduation Year</label>
                <select class="form-select" required>
                    <option value="">Choose...</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                </select>
                <div class="invalid-feedback">
                    Please select a valid Graduation Year.
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label">Roll No.</label>
                <input type="text" class="form-control" id="roll-no-input" required>
                <div class="invalid-feedback">
                    Please provide a valid Roll no.
                </div>
            </div>

        </div>

        <div class="mb-3">
            <input type="checkbox" class="form-check-input"
                id="conditions-checkbox" required>
            <label for="conditions-checkbox">
                Agree to terms and conditions
            </label>
            <div class="invalid-feedback">
                You must agree before submitting.
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit form
        </button>

    </form>
</div>

<script>
    const form = document.querySelector('.needs-validation');

    form.addEventListener('submit', function(event) {

        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }

        form.classList.add('was-validated');

    });
</script>

</body>

</html>
